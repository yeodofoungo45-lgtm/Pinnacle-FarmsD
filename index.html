<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <meta name="theme-color" content="#1a2218"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Pinnacle Farms"/>
  <title>Pinnacle Farms</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{font-family:Georgia,serif;background:#0f1410;color:#e8ede4;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
    button,input,select,textarea{font-family:Georgia,serif}
    ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#1a2218}::-webkit-scrollbar-thumb{background:#3a5a2c;border-radius:4px}
    #app{display:flex;flex-direction:column;height:100dvh}
    .topbar{background:#1a2218;border-bottom:1px solid #2d3d2a;padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .logo{display:flex;align-items:center;gap:10px}
    .logo-icon{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,#7eb856,#4a8a2c);display:flex;align-items:center;justify-content:center;font-size:18px}
    .logo-text{font-weight:700;font-size:15px;color:#c8e0b8;letter-spacing:1px}
    .status-dot{background:#1e2e1a;border:1px solid #2d3d2a;border-radius:8px;padding:5px 12px;font-size:12px;color:#9fd878}
    .page-header{padding:12px 16px 8px;border-bottom:1px solid #1e2e1a;flex-shrink:0}
    .page-title{font-size:17px;font-weight:700;color:#c8e0b8}
    .page-date{font-size:11px;color:#5a7a50;margin-top:2px}
    .content{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
    .bottomnav{position:fixed;bottom:0;left:0;right:0;background:#1a2218;border-top:1px solid #2d3d2a;display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:50;overflow-x:auto}
    .nav-btn{flex:1;min-width:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border:none;background:transparent;cursor:pointer;color:#5a7a50;font-size:8px;letter-spacing:0.3px;position:relative}
    .nav-btn.active{color:#9fd878}
    .nav-icon{font-size:18px}
    .nav-badge{position:absolute;top:4px;right:calc(50% - 18px);background:#c0392b;color:#fff;font-size:9px;padding:1px 5px;border-radius:10px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
    .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
    .kpi{background:#1a2218;border:1px solid #2d3d2a;border-radius:12px;padding:14px}
    .kpi-icon{font-size:18px;margin-bottom:6px}
    .kpi-label{font-size:10px;color:#6b8a60;margin-bottom:3px}
    .kpi-val{font-size:22px;font-weight:700;margin-bottom:2px}
    .kpi-sub{font-size:10px;color:#4a6a40}
    .card{background:#1a2218;border:1px solid #2d3d2a;border-radius:14px;padding:16px;margin-bottom:12px}
    .card-title{font-size:11px;font-weight:700;color:#8ab880;margin-bottom:12px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
    .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #1e2e1a;align-items:center}
    .row:last-child{border-bottom:none}
    .row-label{font-size:12px;color:#6b8a60}
    .row-val{font-size:13px;color:#c8e0b8;font-weight:600}
    .chart{display:flex;align-items:flex-end;gap:5px;height:65px;padding-top:6px}
    .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
    .chart-bar{width:100%;border-radius:3px 3px 0 0;min-height:4px;opacity:.85}
    .chart-lbl{font-size:8px;color:#4a6a40}
    .prog-wrap{height:6px;background:#1e2e1a;border-radius:3px;margin-top:5px}
    .prog-bar{height:100%;border-radius:3px}
    .bat-card{background:#1a2218;border:1px solid #2d3d2a;border-radius:14px;padding:16px;margin-bottom:10px;border-left-width:4px;border-left-style:solid}
    .badge{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .alert-item{background:#1a2218;border-radius:12px;padding:14px;display:flex;gap:10px;margin-bottom:10px;border:1px solid}
    .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.78);display:flex;align-items:flex-end;justify-content:center;z-index:100}
    .modal{background:#1a2218;border:1px solid #3a5a2c;border-radius:20px 20px 0 0;padding:22px;width:100%;padding-bottom:max(22px,env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .modal-title{font-size:17px;font-weight:700;color:#c8e0b8}
    .close-btn{background:none;border:none;color:#6b8a60;font-size:24px;cursor:pointer;padding:4px}
    .btn-row{display:flex;gap:10px;margin-top:14px}
    .btn-outline{flex:1;padding:11px;border-radius:10px;border:1px solid #3a5a2c;background:transparent;color:#9fd878;cursor:pointer;font-size:13px}
    .btn-solid{flex:1;padding:11px;border-radius:10px;border:none;background:linear-gradient(135deg,#7eb856,#4a8a2c);color:#fff;cursor:pointer;font-size:13px;font-weight:700}
    .btn-danger{flex:1;padding:11px;border-radius:10px;border:1px solid #c0392b;background:transparent;color:#e74c3c;cursor:pointer;font-size:13px}
    .field{margin-bottom:12px}
    .field label{display:block;font-size:11px;color:#6b8a60;margin-bottom:5px}
    .field input,.field select{width:100%;background:#0f1410;border:1px solid #3a5a2c;border-radius:8px;padding:9px 11px;color:#e8ede4;font-size:14px;outline:none}
    .field input:focus,.field select:focus{border-color:#7eb856}
    .field select option{background:#1a2218}
    .edit-btn{background:#1e3a15;border:1px solid #3a5a2c;border-radius:8px;color:#9fd878;padding:5px 10px;font-size:11px;cursor:pointer;font-family:Georgia,serif}
    .range-wrap{display:flex;align-items:center;gap:8px}
    .range-wrap input[type=range]{flex:1;accent-color:#7eb856}
    .range-val{font-size:13px;color:#c8e0b8;font-weight:700;min-width:40px;text-align:right}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%);background:#2d4a22;border:1px solid #7eb856;color:#9fd878;padding:10px 20px;border-radius:10px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
    .toast.show{opacity:1}
    .section-tab{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
    .stab{padding:6px 14px;border-radius:20px;border:1px solid #2d3d2a;background:transparent;color:#6b8a60;cursor:pointer;font-size:11px;font-family:Georgia,serif;white-space:nowrap}
    .stab.active{background:#1e3a15;border-color:#7eb856;color:#9fd878}
    .temp-circle{width:80px;height:80px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:3px solid;margin:0 auto 8px}
    .emp-card{background:#1a2218;border:1px solid #2d3d2a;border-radius:12px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
    .emp-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#2d4a22,#4a8a2c);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
    .vente-card{background:#1a2218;border:1px solid #2d3d2a;border-radius:12px;padding:14px;margin-bottom:10px}
    .pill-green{background:#1e3a15;color:#7eb856;font-size:10px;padding:2px 8px;border-radius:10px}
    .pill-red{background:#3a1010;color:#e74c3c;font-size:10px;padding:2px 8px;border-radius:10px}
    .pill-orange{background:#3a2010;color:#e67e22;font-size:10px;padding:2px 8px;border-radius:10px}
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">🐔</div>
      <div class="logo-text">PINNACLE FARMS</div>
    </div>
    <div class="status-dot">● Actif</div>
  </div>
  <div class="page-header">
    <div class="page-title" id="pageTitle">Tableau de bord</div>
    <div class="page-date" id="pageDate"></div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bottomnav">
    <button class="nav-btn active" onclick="nav('dashboard')" id="nav-dashboard"><span class="nav-icon">⊞</span>Board</button>
    <button class="nav-btn" onclick="nav('batiments')" id="nav-batiments"><span class="nav-icon">🏚</span>Bâtiments</button>
    <button class="nav-btn" onclick="nav('sante')" id="nav-sante"><span class="nav-icon">♥</span>Santé</button>
    <button class="nav-btn" onclick="nav('stocks')" id="nav-stocks"><span class="nav-icon">▦</span>Stocks</button>
    <button class="nav-btn" onclick="nav('ventes')" id="nav-ventes"><span class="nav-icon">💰</span>Ventes</button>
    <button class="nav-btn" onclick="nav('employes')" id="nav-employes"><span class="nav-icon">👥</span>Équipe</button>
    <button class="nav-btn" onclick="nav('stats')" id="nav-stats"><span class="nav-icon">📊</span>Stats</button>
    <button class="nav-btn" onclick="nav('alertes')" id="nav-alertes"><span class="nav-icon">⚠</span>Alertes<span class="nav-badge" id="badge-alertes" style="display:none"></span></button>
  </nav>
</div>

<div class="modal-bg" id="modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title"></div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── DONNÉES ──
function loadData(){
  try{const s=localStorage.getItem('pf2');if(s)return JSON.parse(s);}catch(e){}
  return {
    batiments:[
      {id:1,nom:"Bâtiment A",capacite:5000,occupation:4800,age:32,race:"Ross 308",statut:"actif",temp:28},
      {id:2,nom:"Bâtiment B",capacite:6000,occupation:5900,age:18,race:"Cobb 500",statut:"actif",temp:27},
      {id:3,nom:"Bâtiment C",capacite:4500,occupation:0,age:0,race:"—",statut:"vide",temp:26},
      {id:4,nom:"Bâtiment D",capacite:5500,occupation:5200,age:45,race:"Ross 308",statut:"récolte",temp:32},
    ],
    stocks:{
      aliments:{demarrage:800,croissance:3200,finition:5400,ponte:3000},
      medicaments:{desinfectants:80,antibiotiques:60,antistress:75,mineraux:90,vermifuge:50,vitamines:85,anticoccidiose:70},
      vaccins:{newcastle:80,gumboro:65,bronchite:90,marek:100}
    },
    alertes:[
      {id:1,type:"danger",msg:"Bâtiment D: température élevée (32°C)",heure:"09:14"},
      {id:2,type:"warning",msg:"Stock aliment démarrage bas (800 kg)",heure:"08:30"},
      {id:3,type:"info",msg:"Vaccination prévue Bâtiment B demain",heure:"07:00"},
    ],
    mortalites:[{d:"Lun",v:12},{d:"Mar",v:8},{d:"Mer",v:15},{d:"Jeu",v:6},{d:"Ven",v:10},{d:"Sam",v:9},{d:"Dim",v:7}],
    productions:[{s:"S1",p:1.2},{s:"S2",p:1.8},{s:"S3",p:2.5},{s:"S4",p:3.1},{s:"S5",p:3.8},{s:"S6",p:4.4}],
    employes:[
      {id:1,nom:"Konan Kouassi",poste:"Responsable élevage",salaire:180000,contact:"07 00 00 01",statut:"present"},
      {id:2,nom:"Adjoua Marie",poste:"Agent d'élevage",salaire:120000,contact:"07 00 00 02",statut:"present"},
      {id:3,nom:"Bamba Seydou",poste:"Agent vétérinaire",salaire:150000,contact:"07 00 00 03",statut:"absent"},
    ],
    ventes:[
      {id:1,date:"2024-02-15",batiment:"Bâtiment B",quantite:5800,poids:4.2,prix_kg:1800,acheteur:"Marché Abobo",total:43848000},
      {id:2,date:"2024-01-20",batiment:"Bâtiment A",quantite:4900,poids:4.5,prix_kg:1800,acheteur:"Grossiste Yopougon",total:39690000},
    ],
    consommation:[
      {date:"2024-06-01",type:"aliment",detail:"Finition",quantite:450,batiment:"Bâtiment A"},
      {date:"2024-06-01",type:"aliment",detail:"Croissance",quantite:380,batiment:"Bâtiment B"},
      {date:"2024-06-02",type:"medicament",detail:"Vitamines",quantite:2,batiment:"Bâtiment A"},
    ],
    nextId:10
  };
}
function saveData(){try{localStorage.setItem('pf2',JSON.stringify(DATA));}catch(e){}}
let DATA=loadData();
let currentPage='dashboard';
let activeTab={stocks:'aliments',sante:'mortalite'};
const TITLES={dashboard:'Tableau de bord',batiments:'Bâtiments',sante:'Santé & Mortalité',stocks:'Stocks',ventes:'Suivi des ventes',employes:'Gestion du personnel',stats:'Statistiques',alertes:'Alertes'};

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function nav(page){currentPage=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));document.getElementById('nav-'+page).classList.add('active');document.getElementById('pageTitle').textContent=TITLES[page];document.getElementById('content').scrollTop=0;updateBadge();render();}
function updateBadge(){const d=DATA.alertes.filter(a=>a.type==='danger').length;const b=document.getElementById('badge-alertes');b.textContent=d>0?d:'';b.style.display=d>0?'block':'none';}
function setDate(){document.getElementById('pageDate').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});}
function sc(s){return s==='actif'?'#7eb856':s==='récolte'?'#e67e22':'#4a6a40';}
function sb(s){return s==='actif'?'#1e3a15':s==='récolte'?'#3a2010':'#1e2e1a';}
function tempColor(t){return t<20?'#5ba3d9':t<30?'#7eb856':t<34?'#e67e22':'#e74c3c';}
function barChart(data,kx,ky,color){const max=Math.max(...data.map(d=>d[ky]));return `<div class="chart">${data.map(d=>`<div class="chart-col"><div class="chart-bar" style="height:${Math.round(d[ky]/max*56)}px;background:${color}"></div><div class="chart-lbl">${d[kx]}</div></div>`).join('')}</div>`;}
function kpi(icon,label,val,sub,color){return `<div class="kpi"><div class="kpi-icon">${icon}</div><div class="kpi-label">${label}</div><div class="kpi-val" style="color:${color}">${val}</div>${sub?`<div class="kpi-sub">${sub}</div>`:''}</div>`;}
function fmtMoney(n){return n.toLocaleString()+' F';}

// ── RENDER ──
function render(){
  const c=document.getElementById('content');
  if(currentPage==='dashboard')c.innerHTML=renderDashboard();
  else if(currentPage==='batiments')c.innerHTML=renderBatiments();
  else if(currentPage==='sante')c.innerHTML=renderSante();
  else if(currentPage==='stocks')c.innerHTML=renderStocks();
  else if(currentPage==='ventes')c.innerHTML=renderVentes();
  else if(currentPage==='employes')c.innerHTML=renderEmployes();
  else if(currentPage==='stats')c.innerHTML=renderStats();
  else if(currentPage==='alertes')c.innerHTML=renderAlertes();
}

function renderDashboard(){
  const total=DATA.batiments.reduce((a,b)=>a+b.occupation,0);
  const cap=DATA.batiments.reduce((a,b)=>a+b.capacite,0);
  const taux=cap>0?Math.round(total/cap*100):0;
  const mort=DATA.mortalites[DATA.mortalites.length-1].v;
  const dangers=DATA.alertes.filter(a=>a.type==='danger').length;
  const totalVentes=DATA.ventes.reduce((a,b)=>a+b.total,0);
  const presents=DATA.employes.filter(e=>e.statut==='present').length;
  return `
    <div class="grid2">
      ${kpi('🐔','Total Poulets',total.toLocaleString(),'en élevage','#7eb856')}
      ${kpi('⊞','Occupation',taux+'%',DATA.batiments.length+' bâtiments','#5ba3d9')}
      ${kpi('💰','Ventes totales',fmtMoney(totalVentes),'','#e67e22')}
      ${kpi('👥','Personnel',presents+'/'+DATA.employes.length,'présents','#9fd878')}
    </div>
    <div class="card">
      <div class="card-title">🌡 Températures bâtiments</div>
      ${DATA.batiments.map(b=>`
        <div class="row">
          <span style="font-size:12px;color:#b0c8a0">${b.nom}</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:14px;font-weight:700;color:${tempColor(b.temp)}">${b.temp}°C</span>
            <span style="font-size:10px;color:${tempColor(b.temp)}">${b.temp>=34?'🚨 CHAUD':b.temp>=30?'⚠ Tiède':'✓ OK'}</span>
          </div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">État des bâtiments</div>
      ${DATA.batiments.map(b=>`
        <div style="margin-bottom:11px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:12px;color:#b0c8a0">${b.nom}</span>
            <span style="font-size:11px;color:#6b8a60">${b.occupation.toLocaleString()}/${b.capacite.toLocaleString()}</span>
          </div>
          <div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(b.occupation/b.capacite*100)}%;background:${b.statut==='récolte'?'#e67e22':b.statut==='vide'?'#3d5a35':'linear-gradient(90deg,#7eb856,#4a8a2c)'}"></div></div>
        </div>`).join('')}
    </div>
    <div class="card">
      <div class="card-title">Alertes récentes</div>
      ${DATA.alertes.length===0?'<div style="color:#4a6a40;font-size:13px">Aucune alerte</div>':DATA.alertes.slice(0,3).map(a=>`
        <div class="row">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <div style="width:8px;height:8px;border-radius:50%;background:${a.type==='danger'?'#e74c3c':a.type==='warning'?'#e67e22':'#5ba3d9'};margin-top:4px;flex-shrink:0"></div>
            <div style="font-size:12px;color:#b0c8a0">${a.msg}<br><span style="font-size:10px;color:#4a6a40">${a.heure}</span></div>
          </div>
        </div>`).join('')}
    </div>`;
}

function renderBatiments(){
  return `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <span style="color:#6b8a60;font-size:13px">${DATA.batiments.length} bâtiment(s)</span>
      <button class="btn-solid" style="padding:7px 14px;font-size:12px" onclick="openNouveauBat()">+ Nouveau</button>
    </div>
    ${DATA.batiments.map(b=>`
      <div class="bat-card" style="border-left-color:${sc(b.statut)}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-size:16px;font-weight:700;color:#c8e0b8">${b.nom}</span>
          <div style="display:flex;gap:6px;align-items:center">
            <span class="badge" style="background:${sb(b.statut)};color:${sc(b.statut)}">${b.statut}</span>
            <button class="edit-btn" onclick="openEditBat(${b.id})">✏️</button>
          </div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-bottom:8px">
          <span style="font-size:12px;color:#6b8a60">Race: <span style="color:#b0c8a0">${b.race}</span></span>
          <span style="font-size:13px;font-weight:700;color:${tempColor(b.temp)}">🌡 ${b.temp}°C</span>
        </div>
        ${b.occupation>0?`
          <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;color:#6b8a60">
            <span>${b.occupation.toLocaleString()} poulets</span><span>${Math.round(b.occupation/b.capacite*100)}%</span>
          </div>
          <div class="prog-wrap"><div class="prog-bar" style="width:${Math.round(b.occupation/b.capacite*100)}%;background:${b.statut==='récolte'?'#e67e22':'linear-gradient(90deg,#7eb856,#4a8a2c)'}"></div></div>
          <div style="font-size:11px;color:#5a7a50;margin-top:7px">Âge: ${b.age} jours</div>`
        :`<div style="color:#3d5a35;font-size:12px">Vide — prêt pour un nouveau lot</div>`}
      </div>`).join('')}`;
}

function renderSante(){
  const totalMort=DATA.mortalites.reduce((a,b)=>a+b.v,0);
  const total=DATA.batiments.reduce((a,b)=>a+b.occupation,0);
  const taux=total>0?(totalMort/total*100).toFixed(2):'0.00';
  return `
    <div class="grid2">
      ${kpi('♥','Mortalité 7j',totalMort,'total','#e74c3c')}
      ${kpi('%','Taux',taux+'%','','#7eb856')}
    </div>
    <div class="card">
      <div class="card-title">🌡 Températures — Modifier
        <button class="edit-btn" onclick="openEditTemp()">Mettre à jour</button>
      </div>
      <div style="display:flex;justify-content:space-around;flex-wrap:wrap;gap:10px">
        ${DATA.batiments.map(b=>`
          <div style="text-align:center">
            <div class="temp-circle" style="border-color:${tempColor(b.temp)};width:70px;height:70px">
              <div style="font-size:18px;font-weight:700;color:${tempColor(b.temp)}">${b.temp}°</div>

// ── ACTIONS ──
function setTab(page,tab){activeTab[page]=tab;render();}
function changeMort(i,d){DATA.mortalites[i].v=Math.max(0,DATA.mortalites[i].v+d);saveData();render();}
function updateAliment(k,v,input){DATA.stocks.aliments[k]=parseInt(v);const max={demarrage:5000,croissance:10000,finition:15000,ponte:8000}[k];input.nextElementSibling.textContent=Math.round(v/max*100)+'%';saveData();}
function updateMed(k,v,input){DATA.stocks.medicaments[k]=parseInt(v);input.nextElementSibling.textContent=v+'%';saveData();}
function updateVaccin(k,v,input){DATA.stocks.vaccins[k]=parseInt(v);input.nextElementSibling.textContent=v+'%';saveData();}
function resoudreAlerte(i){DATA.alertes.splice(i,1);saveData();updateBadge();render();showToast('✓ Alerte résolue');}
function supprimerVente(i){if(!confirm('Supprimer cette vente ?'))return;DATA.ventes.splice(i,1);saveData();render();showToast('🗑 Vente supprimée');}
function togglePresence(id){const e=DATA.employes.find(x=>x.id===id);e.statut=e.statut==='present'?'absent':'present';saveData();render();}

// ── MODALS ──
function closeModal(){document.getElementById('modal').style.display='none';}
function openModal(title,body){document.getElementById('modal-title').textContent=title;document.getElementById('modal-body').innerHTML=body;document.getElementById('modal').style.display='flex';}

function openEditTemp(){
  openModal('Températures des bâtiments',
    DATA.batiments.map(b=>`
      <div class="field">
        <label>${b.nom} — Température actuelle: <span id="tv${b.id}" style="color:${tempColor(b.temp)}">${b.temp}°C</span></label>
        <div class="range-wrap">
          <input type="range" min="15" max="45" value="${b.temp}" oninput="previewTemp(${b.id},this.value)"/>
          <span style="font-size:13px;color:#c8e0b8;min-width:40px">${b.temp}°C</span>
        </div>
      </div>`).join('')+
    `<div class="btn-row"><button class="btn-outline" onclick="closeModal()">Annuler</button><button class="btn-solid" onclick="sauvegarderTemp()">💾 Sauvegarder</button></div>`
  );
}
function previewTemp(id,v){document.getElementById('tv'+id).textContent=v+'°C';document.getElementById('tv'+id).style.color=tempColor(parseInt(v));}
function sauvegarderTemp(){
  document.querySelectorAll('#modal-body input[type=range]').forEach((input,i)=>{DATA.batiments[i].temp=parseInt(input.value);});
  // check high temps and add alerts
  DATA.batiments.forEach(b=>{if(b.temp>=34){const exists=DATA.alertes.find(a=>a.msg.includes(b.nom)&&a.msg.includes('température'));if(!exists){const now=new Date();DATA.alertes.unshift({id:DATA.nextId++,type:'danger',msg:`${b.nom}: température critique (${b.temp}°C)`,heure:now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')});}}});
  saveData();closeModal();updateBadge();render();showToast('✓ Températures mises à jour');
}

function openEditMort(){
  openModal('Modifier mortalité',
    DATA.mortalites.map((d,i)=>`
      <div class="field"><label>${d.d}</label>
        <div style="display:flex;align-items:center;gap:10px">
          <button onclick="changeMort(${i},-1);this.closest('.modal').querySelector('#mv${i}').textContent=window.DATA.mortalites[${i}].v" style="background:#1e3a15;border:1px solid #3a5a2c;color:#9fd878;border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:18px">−</button>
          <span id="mv${i}" style="font-size:18px;color:#e74c3c;font-weight:700;min-width:30px;text-align:center">${d.v}</span>
          <button onclick="changeMort(${i},1);this.closest('.modal').querySelector('#mv${i}').textContent=window.DATA.mortalites[${i}].v" style="background:#1e3a15;border:1px solid #3a5a2c;color:#9fd878;border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:18px">+</button>
        </div>
      </div>`).join('')+
    `<div class="btn-row"><button class="btn-solid" onclick="closeModal();render()">✓ Fermer</button></div>`
  );
}

function creerBat(){
  const nom=document.getElementById('n-nom').value.trim();
  if(!nom){alert('Entrez un nom');return;}
  DATA.batiments.push({id:DATA.nextId++,nom,race:document.getElementById('n-race').value||'—',capacite:parseInt(document.getElementById('n-cap').value)||0,occupation:parseInt(document.getElementById('n-occ').value)||0,age:parseInt(document.getElementById('n-age').value)||0,temp:parseInt(document.getElementById('n-temp').value)||28,statut:document.getElementById('n-statut').value});
  saveData();closeModal();render();showToast('✓ Bâtiment créé');
}
function openEditBat(id){
  const b=DATA.batiments.find(x=>x.id===id);
  openModal('Modifier — '+b.nom,`
    <div class="field"><label>Nom</label><input id="e-nom" value="${b.nom}"></div>
    <div class="field"><label>Race</label><input id="e-race" value="${b.race}"></div>
    <div class="field"><label>Capacité</label><input id="e-cap" type="number" value="${b.capacite}"></div>
    <div class="field"><label>Occupation</label><input id="e-occ" type="number" value="${b.occupation}"></div>
    <div class="field"><label>Âge (jours)</label><input id="e-age" type="number" value="${b.age}"></div>
    <div class="field"><label>Température (°C)</label><input id="e-temp" type="number" value="${b.temp}"></div>
    <div class="field"><label>Statut</label><select id="e-statut"><option value="actif" ${b.statut==='actif'?'selected':''}>Actif</option><option value="vide" ${b.statut==='vide'?'selected':''}>Vide</option><option value="récolte" ${b.statut==='récolte'?'selected':''}>Récolte</option></select></div>
    <div class="btn-row"><button class="btn-danger" onclick="supprimerBat(${id})">🗑 Supprimer</button><button class="btn-solid" onclick="sauvegarderBat(${id})">💾 Sauvegarder</button></div>`);
}
function sauvegarderBat(id){
  const b=DATA.batiments.find(x=>x.id===id);
  b.nom=document.getElementById('e-nom').value;b.race=document.getElementById('e-race').value;
  b.capacite=parseInt(document.getElementById('e-cap').value)||0;b.occupation=parseInt(document.getElementById('e-occ').value)||0;
  b.age=parseInt(document.getElementById('e-age').value)||0;b.temp=parseInt(document.getElementById('e-temp').value)||28;
  b.statut=document.getElementById('e-statut').value;
  saveData();closeModal();render();showToast('✓ Bâtiment mis à jour');
}
function supprimerBat(id){if(!confirm('Supprimer ce bâtiment ?'))return;DATA.batiments=DATA.batiments.filter(x=>x.id!==id);saveData();closeModal();render();showToast('🗑 Bâtiment supprimé');}

function openNouvelleVente(){
  openModal('Nouvelle vente',`
    <div class="field"><label>Bâtiment</label><select id="v-bat">${DATA.batiments.map(b=>`<option>${b.nom}</option>`).join('')}</select></div>
    <div class="field"><label>Date</label><input id="v-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="field"><label>Nombre de poulets vendus</label><input id="v-qte" type="number" placeholder="5000"></div>
    <div class="field"><label>Poids moyen (kg)</label><input id="v-poids" type="number" step="0.1" placeholder="4.2"></div>
    <div class="field"><label>Prix par kg (FCFA)</label><input id="v-prix" type="number" placeholder="1800"></div>
    <div class="field"><label>Acheteur</label><input id="v-acheteur" placeholder="ex: Marché Abobo"></div>
    <div class="btn-row"><button class="btn-outline" onclick="closeModal()">Annuler</button><button class="btn-solid" onclick="creerVente()">✓ Enregistrer</button></div>`);
}
function creerVente(){
  const qte=parseInt(document.getElementById('v-qte').value)||0;
  const poids=parseFloat(document.getElementById('v-poids').value)||0;
  const prix=parseInt(document.getElementById('v-prix').value)||0;
  const total=qte*poids*prix;
  DATA.ventes.unshift({id:DATA.nextId++,date:document.getElementById('v-date').value,batiment:document.getElementById('v-bat').value,quantite:qte,poids,prix_kg:prix,acheteur:document.getElementById('v-acheteur').value,total});
  saveData();closeModal();render();showToast('✓ Vente enregistrée — '+fmtMoney(total));
}

function openNouvelEmp(){
  openModal('Nouvel employé',`
    <div class="field"><label>Nom complet</label><input id="emp-nom" placeholder="ex: Konan Kouassi"></div>
    <div class="field"><label>Poste</label><input id="emp-poste" placeholder="ex: Agent d'élevage"></div>
    <div class="field"><label>Salaire mensuel (FCFA)</label><input id="emp-sal" type="number" placeholder="120000"></div>
    <div class="field"><label>Contact (téléphone)</label><input id="emp-tel" placeholder="07 00 00 00"></div>
    <div class="btn-row"><button class="btn-outline" onclick="closeModal()">Annuler</button><button class="btn-solid" onclick="creerEmp()">✓ Ajouter</button></div>`);
}
function creerEmp(){
  const nom=document.getElementById('emp-nom').value.trim();
  if(!nom){alert('Entrez un nom');return;}
  DATA.employes.push({id:DATA.nextId++,nom,poste:document.getElementById('emp-poste').value,salaire:parseInt(document.getElementById('emp-sal').value)||0,contact:document.getElementById('emp-tel').value,statut:'present'});
  saveData();closeModal();render();showToast('✓ Employé ajouté');
}
function openEditEmp(id){
  const e=DATA.employes.find(x=>x.id===id);
  openModal('Modifier — '+e.nom,`
    <div class="field"><label>Nom complet</label><input id="ee-nom" value="${e.nom}"></div>
    <div class="field"><label>Poste</label><input id="ee-poste" value="${e.poste}"></div>
    <div class="field"><label>Salaire mensuel (FCFA)</label><input id="ee-sal" type="number" value="${e.salaire}"></div>
    <div class="field"><label>Contact</label><input id="ee-tel" value="${e.contact}"></div>
    <div class="btn-row"><button class="btn-danger" onclick="supprimerEmp(${id})">🗑</button><button class="btn-solid" onclick="sauvegarderEmp(${id})">💾 Sauvegarder</button></div>`);
}
function sauvegarderEmp(id){
  const e=DATA.employes.find(x=>x.id===id);
  e.nom=document.getElementById('ee-nom').value;e.poste=document.getElementById('ee-poste').value;
  e.salaire=parseInt(document.getElementById('ee-sal').value)||0;e.contact=document.getElementById('ee-tel').value;
  saveData();closeModal();render();showToast('✓ Employé mis à jour');
}
function supprimerEmp(id){if(!confirm('Supprimer cet employé ?'))return;DATA.employes=DATA.employes.filter(x=>x.id!==id);saveData();closeModal();render();showToast('🗑 Employé supprimé');}

function openConsommation(){
  openModal('Enregistrer une consommation',`
    <div class="field"><label>Type</label><select id="c-type" onchange="updateConsomForm()"><option value="aliment">🌾 Aliment</option><option value="medicament">💊 Médicament</option><option value="vaccin">💉 Vaccin</option></select></div>
    <div class="field"><label>Détail</label><select id="c-detail"><option>Démarrage</option><option>Croissance</option><option>Finition</option><option>Ponte</option></select></div>
    <div class="field"><label>Bâtiment</label><select id="c-bat">${DATA.batiments.map(b=>`<option>${b.nom}</option>`).join('')}</select></div>
    <div class="field"><label>Quantité</label><input id="c-qte" type="number" placeholder="kg ou unités"></div>
    <div class="field"><label>Date</label><input id="c-date" type="date" value="${new Date().toISOString().split('T')[0]}"></div>
    <div class="btn-row"><button class="btn-outline" onclick="closeModal()">Annuler</button><button class="btn-solid" onclick="enregistrerConso()">✓ Enregistrer</button></div>`);
}
function enregistrerConso(){
  DATA.consommation.push({date:document.getElementById('c-date').value,type:document.getElementById('c-type').value,detail:document.getElementById('c-detail').value,quantite:parseInt(document.getElementById('c-qte').value)||0,batiment:document.getElementById('c-bat').value});
  saveData();closeModal();showToast('✓ Consommation enregistrée');
}

function openNouvelleAlerte(){
  openModal('Nouvelle alerte',`
    <div class="field"><label>Message</label><input id="a-msg" placeholder="Description..."></div>
    <div class="field"><label>Type</label><select id="a-type"><option value="danger">🚨 Danger</option><option value="warning">⚠️ Avertissement</option><option value="info">ℹ️ Information</option></select></div>
    <div class="btn-row"><button class="btn-outline" onclick="closeModal()">Annuler</button><button class="btn-solid" onclick="creerAlerte()">✓ Ajouter</button></div>`);
}
function creerAlerte(){
  const msg=document.getElementById('a-msg').value.trim();
  if(!msg){alert('Entrez un message');return;}
  const now=new Date();
  DATA.alertes.unshift({id:DATA.nextId++,type:document.getElementById('a-type').value,msg,heure:now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0')});
  saveData();closeModal();updateBadge();render();showToast('✓ Alerte ajoutée');
}

setDate();updateBadge();render();
</script>
</body>
</html>
